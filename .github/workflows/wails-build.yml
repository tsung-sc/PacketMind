name: Wails Build

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  WAILS_VERSION: 'v2.11.0'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            platform: windows
            goos: windows
            goarch: amd64
          - name: windows-arm64
            os: windows-latest
            platform: windows
            goos: windows
            goarch: arm64
          - name: darwin-amd64
            os: macos-13
            platform: darwin
            goos: darwin
            goarch: amd64
          - name: darwin-arm64
            os: macos-latest
            platform: darwin
            goos: darwin
            goarch: arm64
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux
            goos: linux
            goarch: amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
            goos: linux
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build frontend
        shell: bash
        run: |
          cd gui
          npm ci
          npm run build

      - name: Build Wails app
        shell: bash
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          wails build -platform ${{ matrix.goos }}/${{ matrix.goarch }} -ldflags "-X github.com/packetmind/packetmind/internal/version.Version=${{ github.ref_name }} -X github.com/packetmind/packetmind/internal/version.BuildTime=${BUILD_TIME} -X github.com/packetmind/packetmind/internal/version.Commit=${{ github.sha }}"

      - name: Prepare dist directory
        shell: bash
        run: mkdir -p dist

      - name: Package Windows portable zip
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\PacketMind\configs | Out-Null
          Copy-Item build\bin\packetmind.exe dist\PacketMind\packetmind.exe
          Copy-Item configs\packetmind.json dist\PacketMind\configs\packetmind.json
          Copy-Item configs\models.json dist\PacketMind\configs\models.json
          Compress-Archive -Path dist\PacketMind\* -DestinationPath "dist\PacketMind_${{ github.ref_name }}_windows_${{ matrix.goarch }}.zip"

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: powershell
        run: choco install innosetup -y

      - name: Package Windows installer
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $env:PACKETMIND_VERSION="${{ github.ref_name }}"
          $env:PACKETMIND_ARCH="${{ matrix.goarch }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\packetmind.iss

      - name: Add configs to macOS bundle
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          mkdir -p build/bin/PacketMind.app/Contents/Resources/configs
          cp configs/packetmind.json build/bin/PacketMind.app/Contents/Resources/configs/
          cp configs/models.json build/bin/PacketMind.app/Contents/Resources/configs/

      - name: Package macOS app zip
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          cd build/bin
          zip -r ../../dist/PacketMind_${{ github.ref_name }}_darwin_${{ matrix.goarch }}.zip PacketMind.app

      - name: Package macOS dmg
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          mkdir -p dist/dmg
          cp -R build/bin/PacketMind.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "PacketMind" -srcfolder dist/dmg -ov -format UDZO "dist/PacketMind_${{ github.ref_name }}_darwin_${{ matrix.goarch }}.dmg"

      - name: Package Linux tarball
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p dist/PacketMind/configs
          cp build/bin/packetmind dist/PacketMind/packetmind
          cp configs/packetmind.json dist/PacketMind/configs/packetmind.json
          cp configs/models.json dist/PacketMind/configs/models.json
          cat > dist/PacketMind/packetmind.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=PacketMind
          Exec=packetmind
          Categories=Development;Network;
          Terminal=false
          EOF
          cd dist
          tar -czf PacketMind_${{ github.ref_name }}_linux_${{ matrix.goarch }}.tar.gz PacketMind

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*

      - name: Collect and checksum
        run: |
          mkdir -p dist
          find release-assets -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.AppImage" \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Generate release notes
        id: release_notes
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -f CHANGELOG.md ]; then
            NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG.md || true)
            if [ -z "$NOTES" ]; then
              NOTES=$(sed -n "/^## \[${TAG}\]/,/^## \[/{ /^## \[${TAG}\]/d; /^## \[/d; p; }" CHANGELOG.md || true)
            fi
            if [ -z "$NOTES" ]; then
              NOTES="See CHANGELOG.md for details."
            fi
          else
            NOTES="Release ${TAG}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            dist/*
          draft: false
          prerelease: false

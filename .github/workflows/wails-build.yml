name: Wails Build

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  WAILS_VERSION: 'v2.11.0'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            goos: windows
            goarch: amd64
            ext: .zip
          - os: macos-latest
            platform: darwin
            goos: darwin
            goarch: arm64
            ext: .zip
          - os: ubuntu-latest
            platform: linux
            goos: linux
            goarch: amd64
            ext: .tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build frontend
        run: |
          cd gui
          npm ci
          npm run build

      - name: Build Wails app
        run: wails build -ldflags "-X github.com/packetmind/packetmind/internal/version.Version=${{ github.ref_name }} -X github.com/packetmind/packetmind/internal/version.BuildTime=$(date -u '+%Y-%m-%d_%H:%M:%S') -X github.com/packetmind/packetmind/internal/version.Commit=${{ github.sha }}"

      - name: Package Windows artifact
        if: matrix.platform == 'windows'
        run: |
          cd build/bin
          Compress-Archive -Path packetmind.exe -DestinationPath ../../PacketMind_${{ github.ref_name }}_windows_amd64.zip

      - name: Package macOS artifact
        if: matrix.platform == 'darwin'
        run: |
          cd build/bin
          zip -r ../../PacketMind_${{ github.ref_name }}_darwin_arm64.zip PacketMind.app

      - name: Package Linux artifact
        if: matrix.platform == 'linux'
        run: |
          cd build/bin
          tar -czf ../../PacketMind_${{ github.ref_name }}_linux_amd64.tar.gz packetmind

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: PacketMind_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.ext }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*

      - name: Collect and checksum
        run: |
          mkdir -p dist
          find release-assets -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          cd dist
          sha256sum *.zip *.tar.gz > checksums.txt
          echo "## Checksums" >> checksums_display.txt
          cat checksums.txt >> checksums_display.txt
          cat checksums.txt

      - name: Generate release notes
        id: release_notes
        run: |
          # Extract changelog section for this version
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -f CHANGELOG.md ]; then
            # Try to extract the section for this version
            NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG.md || true)
            if [ -z "$NOTES" ]; then
              NOTES=$(sed -n "/^## \[${TAG}\]/,/^## \[/{ /^## \[${TAG}\]/d; /^## \[/d; p; }" CHANGELOG.md || true)
            fi
            if [ -z "$NOTES" ]; then
              NOTES="See CHANGELOG.md for details."
            fi
          else
            NOTES="Release ${TAG}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          draft: false
          prerelease: false
